
name: Sync Source Code to This Repo
on:
  workflow_dispatch:

permissions:
  contents: write          # 关键！默认 GITHUB_TOKEN 是只读的，不写这行 push 会失败

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: liflife/HongHuangWorld
          token: ${{ secrets.SOURCE_REPO_PAT }}
          fetch-depth: 0
          path: source-code
          persist-credentials: false      # 别让源仓库 token 残留在 git 配置里

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: target-code               # 用默认 GITHUB_TOKEN，有 contents: write 即可 push

      - name: Copy files (exclude .git)
        run: |
          rsync -a --delete --exclude '.git' source-code/ target-code/

      - name: Commit and push
        working-directory: target-code
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync from source repo" || echo "没有变更，跳过"
          git push
