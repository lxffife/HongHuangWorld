
name: Sync Source Code (exclude workflows)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: liflife/HongHuangWorld
          token: ${{ secrets.SOURCE_REPO_PAT }}
          fetch-depth: 0
          path: source-code
          persist-credentials: false

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: target-code

      - name: Copy files (exclude .git and workflows)
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows' \
            source-code/ target-code/

      - name: Commit and push
        working-directory: target-code
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync source code (workflows excluded)" || echo "没有变更，跳过"
          git push
