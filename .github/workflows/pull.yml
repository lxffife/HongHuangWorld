name: Sync Client/develop → HongHuangWorld/feature/p0-foundation

on:
  workflow_dispatch:        # 仅手动触发

permissions:
  contents: write

concurrency:
  group: sync-feature-p0-foundation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SRC_REPO:   liflife/HongHuangWorld-Client
      SRC_BRANCH: develop
      DST_REPO:   liflife/HongHuangWorld
      DST_BRANCH: feature/p0-foundation
    steps:
      # 0. 只做一件事：确认 PAT 存在 + 对两个仓库都能访问
      - name: 验证 SOURCE_REPO_PAT（对两个仓库均可用）
        env:
          PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${PAT:-}" ]; then
            echo "::error::secrets.SOURCE_REPO_PAT 未设置或为空"
            exit 1
          fi
          if [ "$PAT" != "$(printf '%s' "$PAT" | tr -d '[:space:]')" ]; then
            echo "::warning::PAT 含空白字符（换行/空格），会导致认证失败，请重新粘贴"
          fi

          api() {
            curl -sS \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "$@"
          }

          check_repo() {
            local repo="$1"
            local code
            code=$(api -o /tmp/repo.json -w "%{http_code}" "https://api.github.com/repos/$repo")
            echo "GET /repos/$repo -> HTTP $code"
            case "$code" in
              200) echo "✅ 可访问 $repo" ;;
              401) echo "::error::token 无效 (401)"; cat /tmp/repo.json; exit 1 ;;
              403) echo "::error::已认证但无权限 (403) $repo"; cat /tmp/repo.json; exit 1 ;;
              404) echo "::error::仓库不存在或无权访问 (404) $repo"; cat /tmp/repo.json; exit 1 ;;
              *)   echo "::error::未知状态 HTTP $code $repo"; cat /tmp/repo.json; exit 1 ;;
            esac
          }

          check_repo "$SRC_REPO"
          check_repo "$DST_REPO"

      # 1. 拉源：Client 的 develop 分支
      - name: Checkout source (${{ env.SRC_REPO }}@${{ env.SRC_BRANCH }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_BRANCH }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          fetch-depth: 0
          path: src
          persist-credentials: false     # 源只读，不回写

      # 2. 拉目标：HongHuangWorld 的 feature/p0-foundation 分支
      #    注意：用同一个 PAT，且 persist-credentials 保持 true 以便后面 push
      - name: Checkout target (${{ env.DST_REPO }}@${{ env.DST_BRANCH }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DST_REPO }}
          ref: ${{ env.DST_BRANCH }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          fetch-depth: 0
          path: dst
          persist-credentials: true

      # 3. 文件级同步（保留目标分支的 .github/workflows 不动）
      - name: Sync files (workflows excluded)
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows' \
            src/ dst/

          cd dst
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "Sync from ${SRC_REPO}@${SRC_BRANCH} (workflows excluded)"
            # --force-with-lease 更安全：目标分支被别人推进时会失败而非覆盖
            git push --force-with-lease origin "HEAD:${DST_BRANCH}"
          fi
