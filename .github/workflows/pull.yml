name: Pull All Branches from Source
on:
  workflow_dispatch:        # 仅手动触发

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (all branches)
        uses: actions/checkout@v4
        with:
          repository: liflife/HongHuangWorld   # 源仓库
          token: ${{ secrets.SOURCE_REPO_PAT }}  # 私有仓库必需
          fetch-depth: 0                          # 关键：0 = 拉全部历史
          path: source-code                       # 检出到子目录，避免污染根目录
          persist-credentials: false              # 避免 token 残留到 git config

      - name: List all branches
        working-directory: source-code
        run: |
          echo "=== 本地分支 ==="
          git branch
          echo "=== 远程分支 ==="
          git branch -r
          echo "=== 全部 ==="
          git branch -a
