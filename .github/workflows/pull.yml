name: Sync All Branches (exclude workflows)
on:
  workflow_dispatch:        # 仅手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取源仓库所有分支到 src/
      - name: Checkout source (all branches)
        uses: actions/checkout@v4
        with:
          repository: liflife/HongHuangWorld
          token: ${{ secrets.SOURCE_REPO_PAT }}
          fetch-depth: 0
          path: src
          persist-credentials: false

      # 2. 拉取目标仓库到 dst/
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: dst

      # 3. 同步 main：文件级，排除 workflows
      - name: Sync main (keep target workflows)
        run: |
          set -e
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows' \
            src/ dst/
          cd dst
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync main (workflows excluded)" || echo "no changes on main"
          git push origin HEAD:main

      # 4. 同步 main 之外的所有分支：分支级，保留目标分支上的 workflows
      - name: Sync other branches
        run: |
          set -e

          # 4.1 在 src 里把 refs/remotes/origin/* 复制成 refs/heads/*
          cd "$GITHUB_WORKSPACE/src"
          for b in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/); do
            [ "$b" = "HEAD" ] && continue
            git branch -f "$b" "refs/remotes/origin/$b" 2>/dev/null || true
          done

          # 4.2 在 dst 里注册 src 为 remote，并 fetch 所有分支
          cd "$GITHUB_WORKSPACE/dst"
          git remote remove src 2>/dev/null || true
          git remote add src "$GITHUB_WORKSPACE/src"
          git fetch src '+refs/heads/*:refs/remotes/src/*'

          # 4.3 列出源仓库所有分支（排除 HEAD 和 main）
          branches=$(git for-each-ref --format='%(refname:short)' refs/remotes/src/ \
            | sed 's|^src/||' \
            | grep -v '^HEAD$' \
            | grep -v '^main$' || true)

          if [ -z "$branches" ]; then
            echo "源仓库没有 main 之外的分支，跳过"
            exit 0
          fi

          # 4.4 逐分支同步（保留目标分支自身的 workflows）
          for b in $branches; do
            echo "===== syncing branch: $b ====="
            if ! git checkout -B "$b" "refs/remotes/src/$b"; then
              echo "!! checkout $b 失败，跳过"
              continue
            fi

            # ① 丢弃源分支带入的 workflows
            rm -rf .github/workflows

            # ② 若目标分支原本存在且有 workflows，恢复目标分支的版本
            if git show-ref --verify --quiet "refs/remotes/origin/$b"; then
              if git cat-file -e "refs/remotes/origin/$b:.github/workflows" 2>/dev/null; then
                git checkout "refs/remotes/origin/$b" -- .github/workflows
                echo "   已恢复目标分支 $b 原有的 workflows"
              else
                echo "   目标分支 $b 原本没有 workflows，不创建"
              fi
            else
              echo "   目标分支 $b 首次同步，不带入 workflows"
            fi

            git add -A
            git commit -m "Sync branch $b (workflows excluded)" || echo "no changes on $b"
            git push --force origin "$b" || echo "!! push $b 失败，跳过"
          done
