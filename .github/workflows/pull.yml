name: Sync All Branches (exclude workflows)
on:
  workflow_dispatch:        # 仅手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 0. 诊断 SOURCE_REPO_PAT（不打印 token 本身）
      - name: Diagnose SOURCE_REPO_PAT
        env:
          PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -u

          # 0.0 是否配置
          if [ -z "${PAT:-}" ]; then
            echo "::error::secrets.SOURCE_REPO_PAT 未设置或为空（请确认配置在【运行本 workflow 的仓库】的 Settings→Secrets 中）"
            exit 1
          fi

          # 0.0b 首尾空白/换行会直接导致 Bad credentials
          if [ "$PAT" != "$(printf '%s' "$PAT" | tr -d '[:space:]')" ]; then
            echo "::warning::PAT 含空白字符（换行/空格），这会导致认证失败，请重新粘贴"
          fi

          api() {
            curl -sS \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              "$@"
          }

          echo "== 1) 验证 token 有效性: GET /user =="
          code=$(api -o /tmp/user.json -w "%{http_code}" https://api.github.com/user)
          echo "HTTP $code"
          case "$code" in
            200)
              echo "Token 有效，身份: $(python3 -c "import json;print(json.load(open('/tmp/user.json')).get('login'))")"
              ;;
            401)
              echo "::error::Token 无效或已过期 (401)"
              cat /tmp/user.json
              exit 1
              ;;
            *)
              echo "::error::调用 /user 异常 (HTTP $code)"
              cat /tmp/user.json
              exit 1
              ;;
          esac

          echo "== 2) 验证对源仓库的访问: GET /repos/liflife/HongHuangWorld =="
          code=$(api -o /tmp/repo.json -w "%{http_code}" https://api.github.com/repos/liflife/HongHuangWorld)
          echo "HTTP $code"
          case "$code" in
            200)
              echo "✅ 有权限访问 liflife/HongHuangWorld"
              ;;
            401)
              echo "::error::认证失败，token 无效"
              exit 1
              ;;
            403)
              echo "::error::已认证但无权限（403），检查 PAT 是否属于该仓库/组织，或 fine-grained PAT 的 Contents 权限"
              cat /tmp/repo.json
              exit 1
              ;;
            404)
              echo "::error::仓库不存在或 token 无权访问（404）"
              cat /tmp/repo.json
              exit 1
              ;;
            *)
              echo "::error::未知状态 HTTP $code"
              cat /tmp/repo.json
              exit 1
              ;;
          esac

          echo "== 3) 查看经典 PAT 的 scope（fine-grained PAT 可能无此头，正常） =="
          curl -sSI -H "Authorization: Bearer $PAT" https://api.github.com/user \
            | grep -i '^x-oauth-scopes:' || echo "(无 X-OAuth-Scopes 头)"

      # 1. 拉取源仓库所有分支到 src/
      - name: Checkout source (all branches)
        uses: actions/checkout@v4
        with:
          repository: liflife/HongHuangWorld-Client
          token: ${{ secrets.SOURCE_REPO_PAT }}
          fetch-depth: 0
          path: src
          persist-credentials: false

      # 2. 拉取目标仓库到 dst/（关键：fetch-depth: 0 拿到所有分支 ref）
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: dst
          fetch-depth: 0          # ← 修复点 1

      # 3. 同步 main：文件级，排除 workflows
      - name: Sync main (keep target workflows)
        run: |
          set -e
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows' \
            src/ dst/
          cd dst
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync main (workflows excluded)" || echo "no changes on main"
          git push origin HEAD:main

      # 4. 同步 main 之外的所有分支：分支级，保留目标分支上的 workflows
      - name: Sync other branches
        run: |
          set -e

          # 4.1 在 src 里把 refs/remotes/origin/* 复制成 refs/heads/*
          cd "$GITHUB_WORKSPACE/src"
          for b in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/); do
            [ "$b" = "HEAD" ] && continue
            git branch -f "$b" "refs/remotes/origin/$b" 2>/dev/null || true
          done

          # 4.2 在 dst 里注册 src 为 remote，并 fetch 所有分支
          cd "$GITHUB_WORKSPACE/dst"
          git remote remove src 2>/dev/null || true
          git remote add src "$GITHUB_WORKSPACE/src"
          git fetch src '+refs/heads/*:refs/remotes/src/*'

          # 4.2b 显式再 fetch 一次目标仓库的所有分支 ref（双保险）
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          # 4.3 列出源仓库所有分支（排除 HEAD 和 main）
          branches=$(git for-each-ref --format='%(refname:short)' refs/remotes/src/ \
            | sed 's|^src/||' \
            | grep -v '^HEAD$' \
            | grep -v '^main$' || true)

          if [ -z "$branches" ]; then
            echo "源仓库没有 main 之外的分支，跳过"
            exit 0
          fi

          # 4.4 逐分支同步（保留目标分支自身的 workflows）
          for b in $branches; do
            echo "===== syncing branch: $b ====="
            if ! git checkout -B "$b" "refs/remotes/src/$b"; then
              echo "!! checkout $b 失败，跳过"
              continue
            fi

            # ① 丢弃源分支带入的 workflows
            rm -rf .github/workflows

            # ② 若目标分支原本存在且有 workflows，恢复目标分支的版本
            if git show-ref --verify --quiet "refs/remotes/origin/$b"; then
              if git cat-file -e "refs/remotes/origin/$b:.github/workflows" 2>/dev/null; then
                git checkout "refs/remotes/origin/$b" -- .github/workflows
                echo "   已恢复目标分支 $b 原有的 workflows"
              else
                echo "   目标分支 $b 原本没有 workflows，不创建"
              fi
            else
              echo "   目标分支 $b 首次同步，不带入 workflows"
            fi

            git add -A
            git commit -m "Sync branch $b (workflows excluded)" || echo "no changes on $b"
            git push --force origin "$b" || echo "!! push $b 失败，跳过"
          done
