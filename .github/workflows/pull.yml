
name: Sync All Branches (exclude workflows)
on:
  workflow_dispatch:

permissions:
  contents: write          # 推送到非 main 分支需要；main 用 GITHUB_TOKEN 也够

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取源仓库所有分支
      - name: Checkout source (all branches)
        uses: actions/checkout@v4
        with:
          repository: liflife/HongHuangWorld
          token: ${{ secrets.SOURCE_REPO_PAT }}
          fetch-depth: 0
          path: src
          persist-credentials: false

      # 2. 拉取目标仓库
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: dst

      # 3. 同步 main：文件级，排除 workflows（保护目标 main 自己的工作流）
      - name: Sync main (keep target workflows)
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows' \
            src/ dst/
          cd dst
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync main (workflows excluded)" || echo "no changes on main"
          git push origin HEAD:main

      # 4. 同步其他所有分支：分支级，排除 workflows
      - name: Sync other branches
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/src"
          # 列出源仓库所有远程分支名（去掉 origin/ 前缀、HEAD、main）
          branches=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ \
            | sed 's|^origin/||' \
            | grep -v '^HEAD$' \
            | grep -v '^main$' || true)

          if [ -z "$branches" ]; then
            echo "源仓库没有 main 之外的分支，跳过"
            exit 0
          fi

          for b in $branches; do
            echo "===== syncing branch: $b ====="
            cd "$GITHUB_WORKSPACE/dst"
            git fetch "$GITHUB_WORKSPACE/src" "$b"
            git checkout -B "$b" FETCH_HEAD
            # 排除工作流目录
            rm -rf .github/workflows
            git add -A
            git commit -m "Sync branch $b (workflows excluded)" || echo "no changes on $b"
            # 覆盖目标同名分支（同步语义）
            git push --force origin "$b"
          done
