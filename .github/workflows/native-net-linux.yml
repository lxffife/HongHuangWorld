name: NativeNet - Linux x86_64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0 or 0.1.1"
        required: true
        default: "0.1.0"
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  linux-x64:
    name: Build and publish Linux x86_64 SO
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version. Use semantic version format such as 0.1.0 or 0.1.1-rc.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip zip
          python3 -m pip install --user "cmake>=3.24,<4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build/godot-native-net
          key: native-net-linux-x64-v3
          restore-keys: |
            native-net-linux-x64-

      - name: Build GDExtension
        run: |
          cmake --version
          cmake -S Client/NativeNet -B build/godot-native-net -DCMAKE_BUILD_TYPE=Release
          cmake --build build/godot-native-net --config Release --parallel 2
          test -s Client/HongHuangClient/bin/libhonghuang_native_net.so

      - name: Package Linux client native library
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package="HongHuangClient-Linux-x86_64-v${RELEASE_VERSION}"
          mkdir -p release-package
          cp Client/HongHuangClient/bin/libhonghuang_native_net.so release-package/
          cat > release-package/README.txt <<EOF
          HongHuangWorld NativeNet
          Platform: Linux x86_64
          Version: ${RELEASE_VERSION}
          Build: ${GITHUB_SHA}

          Copy libhonghuang_native_net.so into the Client/HongHuangClient/bin directory
          of the matching client source version.
          This package contains the native SO only; it is not a complete game client.
          EOF
          cd release-package
          zip -9 "../${package}.zip" libhonghuang_native_net.so README.txt
          cd ..
          echo "PACKAGE_NAME=${package}.zip" >> "$GITHUB_ENV"
          ls -lh "${package}.zip"

      - name: Publish Linux Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: client-linux-v${{ inputs.version }}
          name: HongHuangWorld Linux Client v${{ inputs.version }}
          body: |
            Linux x86_64 NativeNet build.

            - Platform: Linux x86_64
            - Version: ${{ inputs.version }}
            - Source commit: ${{ github.sha }}
            - Package: NativeNet shared library (.so) only, not a complete game client.

            Place `libhonghuang_native_net.so` in `Client/HongHuangClient/bin/` for the matching source version.
          files: ${{ env.PACKAGE_NAME }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
