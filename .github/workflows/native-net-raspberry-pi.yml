name: NativeNet - Raspberry Pi ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raspberry-pi-arm64:
    name: Raspberry Pi OS compatible ARM64 SO
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build against Ubuntu 22.04 ARM64 baseline
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ubuntu:22.04 bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential git python3 python3-pip
              python3 -m pip install "cmake>=3.24,<4"
              cmake --version
              cmake -S Client/NativeNet -B build/godot-native-net-arm64 -DCMAKE_BUILD_TYPE=Release
              cmake --build build/godot-native-net-arm64 --config Release --parallel 2
              test -s Client/HongHuangClient/bin/libhonghuang_native_net.so
              ls -lh Client/HongHuangClient/bin/libhonghuang_native_net.so
            '

      - name: Build scope
        run: echo "ARM64 compatibility build only; no binary is uploaded or committed."
