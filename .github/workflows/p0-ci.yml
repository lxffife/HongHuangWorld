name: P0 foundation CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/**']

concurrency:
  group: p0-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-backend:
    name: Go backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true
          cache-dependency-path: Backend/go.mod
      - name: Resolve and verify modules
        working-directory: Backend
        run: go mod tidy
      - name: Test
        working-directory: Backend
        run: go test ./...
      - name: Vet
        working-directory: Backend
        run: go vet ./...

  cpp-world-server:
    name: C++ world server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ENet
        run: sudo apt-get update && sudo apt-get install -y libenet-dev libcurl4-openssl-dev nlohmann-json3-dev pkg-config
      - name: Configure
        run: cmake -S GameServer/WorldServer -B build/world-server -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/world-server --config Release --parallel
      - name: Test protocol codec
        run: ctest --test-dir build/world-server --output-on-failure

  database-migration:
    name: PostgreSQL migration up/down
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: honghuang
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: honghuang
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honghuang -d honghuang"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply initial migration
        env:
          PGPASSWORD: ci-password
        run: psql -h localhost -U honghuang -d honghuang -v ON_ERROR_STOP=1 -f Database/migrations/000001_initial_schema.up.sql
      - name: Roll back initial migration
        env:
          PGPASSWORD: ci-password
        run: psql -h localhost -U honghuang -d honghuang -v ON_ERROR_STOP=1 -f Database/migrations/000001_initial_schema.down.sql
      - name: Apply migration again
        env:
          PGPASSWORD: ci-password
        run: psql -h localhost -U honghuang -d honghuang -v ON_ERROR_STOP=1 -f Database/migrations/000001_initial_schema.up.sql

  godot-native-network:
    name: Godot native ENet extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native extension
        run: cmake -S Client/NativeNet -B build/godot-native-net -DCMAKE_BUILD_TYPE=Release
      - name: Build native extension
        run: cmake --build build/godot-native-net --config Release --parallel
      - name: Verify extension artifact
        run: test -s Client/HongHuangClient/bin/libhonghuang_native_net.so
