name: P0 foundation CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/**']

permissions:
  contents: read

jobs:
  go-backend:
    name: Go backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true
          cache-dependency-path: Backend/go.mod
      - name: Resolve and verify modules
        working-directory: Backend
        run: go mod tidy
      - name: Test
        working-directory: Backend
        run: go test ./...
      - name: Vet
        working-directory: Backend
        run: go vet ./...

  cpp-world-server:
    name: C++ world server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S GameServer/WorldServer -B build/world-server -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/world-server --config Release --parallel
